<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thumbnail Processor — 360 Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #f7f4ef;
      --sand:        #e8e1d5;
      --charcoal:    #1c1c1e;
      --ink:         #2d2d2f;
      --gold:        #c9a96e;
      --gold-light:  #e8c98a;
      --glass-dark:  rgba(18, 17, 15, 0.72);
      --radius-card: 20px;
      --radius-btn:  10px;
      --shadow-card: 0 24px 64px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.12);
      --font-display: 'Cormorant Garamond', 'Georgia', serif;
      --font-body:    'DM Sans', 'Helvetica Neue', sans-serif;
      --transition:   0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      background:
        radial-gradient(ellipse 80% 60% at 60% 0%, rgba(201,169,110,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 10% 100%, rgba(201,169,110,0.08) 0%, transparent 60%),
        var(--cream);
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .back-link:hover { color: var(--gold-light); text-decoration: underline; }

    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 300;
      color: var(--charcoal);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
      letter-spacing: 0.03em;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--sand);
      border-radius: var(--radius-card);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: rgba(255,255,255,0.6);
      position: relative;
    }

    .drop-zone.drag-over {
      border-color: var(--gold);
      background: rgba(201,169,110,0.08);
      transform: scale(1.01);
    }

    .drop-zone-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .drop-zone-text {
      font-size: 14px;
      color: #888;
      margin-bottom: 6px;
    }

    .drop-zone-hint {
      font-size: 11px;
      color: #bbb;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Preview grid */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .thumb-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .thumb-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.14);
    }

    .thumb-card canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--charcoal);
    }

    .thumb-card-info {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .thumb-card-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
    }

    .thumb-card-size {
      font-size: 10px;
      color: #aaa;
    }

    .btn-download-one {
      border: none;
      background: none;
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background var(--transition);
    }

    .btn-download-one:hover {
      background: rgba(201,169,110,0.15);
    }

    /* Actions bar */
    .actions-bar {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.04em;
    }

    .btn-primary {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 4px 16px rgba(201,169,110,0.3);
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(201,169,110,0.4);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid var(--sand);
    }
    .btn-secondary:hover {
      border-color: var(--gold);
      color: #7a5c22;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #aaa;
      min-height: 18px;
    }

    @media (max-width: 720px) {
      .page-wrapper { padding: 24px 14px 40px; }
      .drop-zone { padding: 32px 16px; }
      .preview-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="container">

      <a href="index.html" class="back-link">&larr; Back to Tour</a>
      <p class="eyebrow">Tool</p>
      <h1>Thumbnail Processor</h1>
      <p class="subtitle">Drop panorama images to generate dusk-styled 200x130 thumbnails</p>

      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">&#9681;</div>
        <p class="drop-zone-text">Drag & drop images here, or click to browse</p>
        <p class="drop-zone-hint">Accepts JPG, PNG, WebP, HEIC</p>
        <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp,image/heic,.heic,.jpg,.jpeg,.png,.webp" />
      </div>

      <div class="preview-grid" id="preview-grid"></div>

      <div class="actions-bar" id="actions-bar" style="display:none;">
        <button class="btn btn-primary" id="btn-download-all">Download All</button>
        <button class="btn btn-secondary" id="btn-clear">Clear All</button>
      </div>

      <p class="status" id="status"></p>

    </div>
  </div>

  <script>
  (function () {
    "use strict";

    var THUMB_W = 200;
    var THUMB_H = 130;
    var thumbnails = []; // { canvas, filename }

    var $dropZone  = document.getElementById("drop-zone");
    var $fileInput = document.getElementById("file-input");
    var $grid      = document.getElementById("preview-grid");
    var $actions   = document.getElementById("actions-bar");
    var $status    = document.getElementById("status");
    var $btnAll    = document.getElementById("btn-download-all");
    var $btnClear  = document.getElementById("btn-clear");

    // ── Drag & drop ──────────────────────────────────────────
    $dropZone.addEventListener("dragover", function (e) {
      e.preventDefault();
      $dropZone.classList.add("drag-over");
    });

    $dropZone.addEventListener("dragleave", function () {
      $dropZone.classList.remove("drag-over");
    });

    $dropZone.addEventListener("drop", function (e) {
      e.preventDefault();
      $dropZone.classList.remove("drag-over");
      handleFiles(e.dataTransfer.files);
    });

    $fileInput.addEventListener("change", function () {
      handleFiles($fileInput.files);
      $fileInput.value = "";
    });

    // ── Process files ────────────────────────────────────────
    function handleFiles(fileList) {
      var files = Array.from(fileList);
      var validTypes = ["image/jpeg", "image/png", "image/webp", "image/heic"];
      var count = 0;

      files.forEach(function (file) {
        // Check extension for HEIC since MIME may not be set
        var ext = file.name.split(".").pop().toLowerCase();
        var isValid = validTypes.indexOf(file.type) !== -1 ||
                      ext === "heic" || ext === "jpg" || ext === "jpeg" ||
                      ext === "png" || ext === "webp";

        if (!isValid) return;

        count++;
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            processImage(img);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      if (count === 0) {
        $status.textContent = "No valid image files found. Accepts JPG, PNG, WebP, HEIC.";
      }
    }

    // ── Resize + apply dusk effect ───────────────────────────
    function processImage(img) {
      var canvas = document.createElement("canvas");
      canvas.width  = THUMB_W;
      canvas.height = THUMB_H;
      var ctx = canvas.getContext("2d");

      // ── Draw resized image (cover crop) ──
      var srcRatio = img.width / img.height;
      var dstRatio = THUMB_W / THUMB_H;
      var sx, sy, sw, sh;

      if (srcRatio > dstRatio) {
        sh = img.height;
        sw = sh * dstRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = sw / dstRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, THUMB_W, THUMB_H);

      // ── Apply contrast + saturation boost via pixel manipulation ──
      var imageData = ctx.getImageData(0, 0, THUMB_W, THUMB_H);
      var data = imageData.data;
      for (var i = 0; i < data.length; i += 4) {
        // Contrast boost (1.12)
        data[i]     = clamp(((data[i]     / 255 - 0.5) * 1.12 + 0.5) * 255);
        data[i + 1] = clamp(((data[i + 1] / 255 - 0.5) * 1.12 + 0.5) * 255);
        data[i + 2] = clamp(((data[i + 2] / 255 - 0.5) * 1.12 + 0.5) * 255);

        // Slight brightness reduction (0.88)
        data[i]     = clamp(data[i]     * 0.88);
        data[i + 1] = clamp(data[i + 1] * 0.88);
        data[i + 2] = clamp(data[i + 2] * 0.88);
      }
      ctx.putImageData(imageData, 0, 0);

      // ── Sky darkening gradient (top 40%) ──
      var skyGrad = ctx.createLinearGradient(0, 0, 0, THUMB_H * 0.4);
      skyGrad.addColorStop(0,   "rgba(12, 17, 40, 0.62)");
      skyGrad.addColorStop(0.4, "rgba(25, 30, 65, 0.40)");
      skyGrad.addColorStop(0.7, "rgba(45, 40, 80, 0.18)");
      skyGrad.addColorStop(1,   "rgba(45, 40, 80, 0)");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, THUMB_W, THUMB_H * 0.4);

      // ── Warm amber gradient (bottom 30%) ──
      var warmGrad = ctx.createLinearGradient(0, THUMB_H, 0, THUMB_H * 0.7);
      warmGrad.addColorStop(0,   "rgba(200, 150, 60, 0.22)");
      warmGrad.addColorStop(0.4, "rgba(220, 170, 80, 0.12)");
      warmGrad.addColorStop(1,   "rgba(220, 170, 80, 0)");
      ctx.fillStyle = warmGrad;
      ctx.fillRect(0, THUMB_H * 0.7, THUMB_W, THUMB_H * 0.3);

      // ── Blue-purple vignette ──
      var vigGrad = ctx.createRadialGradient(
        THUMB_W / 2, THUMB_H / 2, THUMB_W * 0.25,
        THUMB_W / 2, THUMB_H / 2, THUMB_W * 0.75
      );
      vigGrad.addColorStop(0, "rgba(20, 15, 45, 0)");
      vigGrad.addColorStop(1, "rgba(20, 15, 45, 0.35)");
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, THUMB_W, THUMB_H);

      // ── Add to grid ──
      var index = thumbnails.length + 1;
      var filename = "thumb-" + index + ".jpg";
      thumbnails.push({ canvas: canvas, filename: filename });

      var card = document.createElement("div");
      card.className = "thumb-card";

      var info = document.createElement("div");
      info.className = "thumb-card-info";

      var nameEl = document.createElement("div");
      var nameSpan = document.createElement("span");
      nameSpan.className = "thumb-card-name";
      nameSpan.textContent = filename;
      var sizeSpan = document.createElement("span");
      sizeSpan.className = "thumb-card-size";
      sizeSpan.textContent = " " + THUMB_W + "x" + THUMB_H;
      nameEl.appendChild(nameSpan);
      nameEl.appendChild(sizeSpan);

      var dlBtn = document.createElement("button");
      dlBtn.className = "btn-download-one";
      dlBtn.textContent = "Download";
      dlBtn.addEventListener("click", function () {
        downloadCanvas(canvas, filename);
      });

      info.appendChild(nameEl);
      info.appendChild(dlBtn);
      card.appendChild(canvas);
      card.appendChild(info);
      $grid.appendChild(card);

      $actions.style.display = "flex";
      $status.textContent = thumbnails.length + " thumbnail" + (thumbnails.length > 1 ? "s" : "") + " processed";
    }

    function clamp(val) {
      return Math.max(0, Math.min(255, Math.round(val)));
    }

    // ── Download helpers ─────────────────────────────────────
    function downloadCanvas(canvas, filename) {
      var link = document.createElement("a");
      link.download = filename;
      link.href = canvas.toDataURL("image/jpeg", 0.92);
      link.click();
    }

    $btnAll.addEventListener("click", function () {
      thumbnails.forEach(function (t) {
        downloadCanvas(t.canvas, t.filename);
      });
    });

    $btnClear.addEventListener("click", function () {
      thumbnails = [];
      $grid.innerHTML = "";
      $actions.style.display = "none";
      $status.textContent = "";
    });

  })();
  </script>

</body>
</html>
